<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Configuraciones - ESERCOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/app.css?v=notif1" rel="stylesheet">
</head>
<body>
  <script src="/js/auth.js?v=notif2"></script>
  <script src="/js/ui.js?v=resp2"></script>
  <script>
    const user = renderShell('/configuraciones.html', '<i class="fas fa-cog"></i> Configuraciones', 'Maestros y perfiles operativos');

    let state = { users: [], mats: [], provs: [], cecos: [], roles: [], depts: [], empresasList: [], resumen: {}, permisos: [], flotaCatalogo: { total: 0, ultima_carga: null, archivo_nombre: null, cargado_por_nombre: null, alert_email: 'flota@serviciossercom.cl', data: [] } };

    const ROLE_CB_PREFIX = 'rf_';

    function rolePageCbId(key) {
      return ROLE_CB_PREFIX + PagesCatalog.pageCheckboxId(key);
    }

    function renderRolePagesCheckboxes() {
      const pages = window.PAGES_CATALOG || [];
      return `
        <div class="role-pages-panel">
          <label class="role-all-access">
            <input type="checkbox" id="rAllPages">
            <span><strong>Acceso total</strong> — todas las páginas del sistema</span>
          </label>
          <div class="role-pages-toolbar">
            <button type="button" class="btn btn-outline btn-sm" id="rPagesSelectAll">Marcar todas</button>
            <button type="button" class="btn btn-outline btn-sm" id="rPagesSelectNone">Ninguna</button>
          </div>
          <div class="cfg-search-wrap role-pages-search">
            <i class="fas fa-search"></i>
            <input type="search" id="rPagesSearch" placeholder="Buscar página por nombre…" autocomplete="off">
          </div>
          <div class="role-pages-grid" id="rPagesGrid">
            ${pages.map((p) => `
              <label class="role-page-check" data-page-label="${escapeHtml(String(p.label || '').toLowerCase())}">
                <input type="checkbox" id="${rolePageCbId(p.key)}" data-page-key="${p.key}">
                <span class="role-page-check-text">${escapeHtml(p.label)}</span>
              </label>
            `).join('')}
          </div>
        </div>`;
    }

    function setRolePages(pages) {
      let arr = pages;
      try { if (typeof arr === 'string') arr = JSON.parse(arr); } catch (_) {}
      if (!Array.isArray(arr)) arr = ['*'];
      const all = arr.includes('*');
      const rAll = document.getElementById('rAllPages');
      if (rAll) rAll.checked = all;
      (window.PAGES_CATALOG || []).forEach((p) => {
        const el = document.getElementById(rolePageCbId(p.key));
        if (!el) return;
        el.checked = all || arr.some((x) => PagesCatalog.keysMatch(x, p.key));
        el.disabled = all;
      });
    }

    function readRolePages() {
      if (document.getElementById('rAllPages')?.checked) return ['*'];
      const selected = (window.PAGES_CATALOG || [])
        .filter((p) => document.getElementById(rolePageCbId(p.key))?.checked)
        .map((p) => p.key);
      if (!selected.length) throw new Error('Selecciona al menos una página o marca Acceso total');
      return selected;
    }

    function bindRolePagesUi() {
      const rAll = document.getElementById('rAllPages');
      rAll?.addEventListener('change', () => {
        const on = rAll.checked;
        (window.PAGES_CATALOG || []).forEach((p) => {
          const el = document.getElementById(rolePageCbId(p.key));
          if (!el) return;
          el.disabled = on;
          if (on) el.checked = true;
        });
      });
      document.getElementById('rPagesSelectAll')?.addEventListener('click', () => {
        if (rAll) rAll.checked = false;
        (window.PAGES_CATALOG || []).forEach((p) => {
          const el = document.getElementById(rolePageCbId(p.key));
          if (el) { el.disabled = false; el.checked = true; }
        });
      });
      document.getElementById('rPagesSelectNone')?.addEventListener('click', () => {
        if (rAll) rAll.checked = false;
        (window.PAGES_CATALOG || []).forEach((p) => {
          const el = document.getElementById(rolePageCbId(p.key));
          if (el) { el.disabled = false; el.checked = false; }
        });
      });
    }

    function bindRolePagesSearch() {
      const input = document.getElementById('rPagesSearch');
      if (!input) return;
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        document.querySelectorAll('.role-page-check').forEach((el) => {
          const label = el.getAttribute('data-page-label') || '';
          el.classList.toggle('role-filtered-out', !!(q && !label.includes(q)));
        });
      });
    }

    function openRoleForm(editRole) {
      closeModal('modalRoles');
      resetRoleForm(editRole);
      const host = document.getElementById('roleFormPagesHost');
      if (host) {
        host.innerHTML = renderRolePagesCheckboxes();
        bindRolePagesUi();
        bindRolePagesSearch();
        setRolePages(editRole?.paginas_permitidas || ['home.html', 'solicitud-salida-materiales.html']);
      }
      openModal('modalRoleForm');
    }

    function closeRoleForm() {
      closeModal('modalRoleForm');
      openModal('modalRoles');
    }

    function resetRoleForm(editRole) {
      rId.value = editRole ? editRole.id : '';
      roleFormTitle.textContent = editRole ? `Editar rol: ${editRole.nombre}` : 'Nuevo rol';
      rNombre.value = editRole?.nombre || '';
      rDesc.value = editRole?.descripcion || '';
      btnRoleSave.textContent = editRole ? 'Guardar cambios' : 'Crear rol';
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function filterUsersByQuery(q, limit = 20, opts = {}) {
      const n = String(q || '').trim().toLowerCase();
      const rolId = opts.rolId ? String(opts.rolId) : '';
      let list = state.users || [];
      if (rolId) {
        list = list.filter((u) => {
          const ids = Array.isArray(u.rol_ids) && u.rol_ids.length
            ? u.rol_ids.map(String)
            : [String(u.rol_id || '')];
          return ids.includes(rolId);
        });
      }
      if (!n) return list.slice(0, limit);
      return list.filter((u) => {
        const hay = `${u.nombre} ${u.apellido} ${u.email || ''} ${u.cargo || ''} ${u.rol || ''} ${u.departamento || ''}`.toLowerCase();
        return hay.includes(n);
      }).slice(0, limit);
    }

    function userSearchHaystack(u) {
      return `${u.nombre} ${u.apellido} ${u.email || ''} ${u.cargo || ''} ${u.rol || ''} ${u.departamento || ''}`.toLowerCase();
    }

    function bindModalListFilter({ inputId, selectId, rowSelector, getText }) {
      const input = document.getElementById(inputId);
      const select = selectId ? document.getElementById(selectId) : null;
      if (!input && !select) return;
      const apply = () => {
        const q = (input?.value || '').trim().toLowerCase();
        const rol = select?.value || '';
        let visible = 0;
        document.querySelectorAll(rowSelector).forEach((row) => {
          const text = (typeof getText === 'function' ? getText(row) : row.getAttribute('data-search') || row.textContent || '').toLowerCase();
          const matchQ = !q || text.includes(q);
          const matchRol = !rol || String(row.getAttribute('data-rol-ids') || row.getAttribute('data-rol-id') || '')
            .split(',')
            .map((x) => x.trim())
            .includes(rol);
          const show = matchQ && matchRol;
          row.hidden = !show;
          if (show) visible += 1;
        });
        const empty = document.querySelector(`[data-empty-for="${inputId}"]`);
        if (empty) empty.hidden = visible > 0;
      };
      input?.addEventListener('input', apply);
      select?.addEventListener('change', apply);
      apply();
    }

    function bindAllListFilters() {
      bindModalListFilter({ inputId: 'usersListSearch', selectId: 'usersListRolFilter', rowSelector: '#usersTableBody tr[data-search]' });
      bindModalListFilter({ inputId: 'rolesListSearch', rowSelector: '#rolesTableBody tr[data-search]' });
      bindModalListFilter({ inputId: 'matsListSearch', rowSelector: '#matsTableBody tr[data-search]' });
      bindModalListFilter({ inputId: 'cecosListSearch', rowSelector: '#cecosTableBody tr[data-search]' });
      bindModalListFilter({ inputId: 'provsListSearch', rowSelector: '#provsTableBody tr[data-search]' });
      bindModalListFilter({ inputId: 'flotaListSearch', rowSelector: '#flotaTableBody tr[data-search]' });
    }

    const PERM_MOD_ICONS = {
      Materiales: 'fa-boxes-stacked',
      Compras: 'fa-cart-shopping',
      'Camión Pluma': 'fa-truck-ramp-box',
      SSGG: 'fa-screwdriver-wrench',
      Flota: 'fa-truck',
      'Portal Proveedores': 'fa-store',
      Facturas: 'fa-file-invoice-dollar',
      General: 'fa-shield-halved'
    };

    function renderPermisosList() {
      const list = state.permisos || [];
      if (!list.length) {
        return '<div class="empty">Sin catálogo de permisos. Reinicia el servidor Node para crear las tablas.</div>';
      }
      const byMod = {};
      list.forEach((p) => {
        const m = p.modulo || 'General';
        if (!byMod[m]) byMod[m] = [];
        byMod[m].push(p);
      });
      return Object.keys(byMod).map((mod) => `
        <section class="perm-mod" data-perm-mod="${escapeHtml(mod)}">
          <header class="perm-mod-head">
            <span class="perm-mod-icon"><i class="fas ${PERM_MOD_ICONS[mod] || PERM_MOD_ICONS.General}"></i></span>
            <div>
              <h3 class="perm-mod-title">${escapeHtml(mod)}</h3>
              <p class="perm-mod-sub">${byMod[mod].length} permiso${byMod[mod].length === 1 ? '' : 's'}</p>
            </div>
          </header>
          <div class="perm-mod-grid">
          ${byMod[mod].map((p) => `
            <article class="perm-card" data-codigo="${p.codigo}" data-perm-search="${escapeHtml(`${p.titulo} ${p.descripcion || ''} ${(p.usuarios || []).map((u) => u.nombre).join(' ')}`)}">
              <div class="perm-card-top">
                <h4 class="perm-card-title">${escapeHtml(p.titulo)}</h4>
                ${p.flag ? `<span class="perm-flag-badge" title="Flag de usuario">${escapeHtml(String(p.flag).replace('flag_', ''))}</span>` : ''}
              </div>
              <p class="perm-desc">${escapeHtml(p.descripcion || '')}</p>
              <div class="perm-users-label">Personas asignadas</div>
              <div class="perm-users">
                ${(p.usuarios || []).map((u) => `
                  <span class="perm-chip${u.titular ? ' is-titular' : ''}">
                    <span class="perm-chip-name">${escapeHtml(u.nombre)}</span>
                    ${u.cargo ? `<span class="perm-chip-meta">${escapeHtml(u.cargo)}</span>` : ''}
                    ${u.titular ? '<span class="perm-chip-tag">Titular</span>' : ''}
                    <button type="button" class="perm-chip-x" title="Quitar"
                      data-quitar-perm="${p.codigo}" data-quitar-uid="${u.usuario_id}">&times;</button>
                  </span>
                `).join('') || '<span class="perm-empty">Nadie asignado aún</span>'}
              </div>
              <div class="perm-add">
                <div class="perm-user-picker">
                  <div class="cfg-search-wrap perm-search-inline">
                    <i class="fas fa-search"></i>
                    <input type="text" class="perm-user-search" placeholder="Buscar por nombre, cargo o rol…"
                      autocomplete="off" data-perm-search="${p.codigo}">
                  </div>
                  <input type="hidden" data-perm-user-id="${p.codigo}" value="">
                  <div class="perm-user-dropdown" data-perm-dropdown="${p.codigo}" hidden></div>
                </div>
                <button type="button" class="btn btn-primary btn-sm perm-assign-btn" data-add-perm="${p.codigo}">
                  <i class="fas fa-user-plus"></i> Asignar
                </button>
              </div>
            </article>
          `).join('')}
          </div>
        </section>
      `).join('');
    }

    function bindPermGlobalSearch() {
      const input = document.getElementById('permGlobalSearch');
      const select = document.getElementById('permGlobalRolFilter');
      if (!input) return;
      const apply = () => {
        const q = input.value.trim().toLowerCase();
        const rolId = select?.value || '';
        document.querySelectorAll('.perm-card').forEach((card) => {
          const text = (card.getAttribute('data-perm-search') || card.textContent || '').toLowerCase();
          const matchQ = !q || text.includes(q);
          let matchRol = true;
          if (rolId) {
            matchRol = false;
            card.querySelectorAll('[data-quitar-uid]').forEach((btn) => {
              const u = state.users.find((x) => String(x.id) === String(btn.getAttribute('data-quitar-uid')));
              if (u && (
                String(u.rol_id) === rolId
                || (Array.isArray(u.rol_ids) && u.rol_ids.map(String).includes(rolId))
              )) matchRol = true;
            });
          }
          card.classList.toggle('perm-filtered-out', !(matchQ && matchRol));
        });
        document.querySelectorAll('.perm-mod').forEach((mod) => {
          const visible = mod.querySelectorAll('.perm-card:not(.perm-filtered-out)').length;
          mod.classList.toggle('perm-filtered-out', visible === 0);
        });
      };
      input.addEventListener('input', apply);
      select?.addEventListener('change', apply);
    }

    function bindPermUserSearch() {
      document.querySelectorAll('.perm-user-search').forEach((input) => {
        const codigo = input.getAttribute('data-perm-search');
        const dropdown = document.querySelector(`[data-perm-dropdown="${codigo}"]`);
        const hidden = document.querySelector(`[data-perm-user-id="${codigo}"]`);
        if (!dropdown || !hidden) return;

        const showList = (items) => {
          if (!items.length) {
            dropdown.innerHTML = '<div class="perm-user-empty">Sin resultados</div>';
          } else {
            dropdown.innerHTML = items.map((u) => {
              const label = `${u.nombre} ${u.apellido}`.trim();
              const meta = [u.cargo, u.rol, u.email].filter(Boolean).join(' · ');
              return `<button type="button" class="perm-user-option" data-pick-uid="${u.id}">
                <span class="perm-user-option-name">${escapeHtml(label)}</span>
                <span class="perm-user-option-meta">${escapeHtml(meta)}</span>
              </button>`;
            }).join('');
            dropdown.querySelectorAll('.perm-user-option').forEach((btn, idx) => {
              const u = items[idx];
              const label = `${u.nombre} ${u.apellido}`.trim();
              btn.onclick = () => {
                hidden.value = String(u.id);
                input.value = label;
                dropdown.hidden = true;
              };
            });
          }
          dropdown.hidden = false;
        };

        input.oninput = () => {
          hidden.value = '';
          showList(filterUsersByQuery(input.value, 20));
        };
        input.onfocus = () => showList(filterUsersByQuery(input.value, 20));
      });

      if (!window.__permPickerCloseBound) {
        window.__permPickerCloseBound = true;
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.perm-user-picker')) {
            document.querySelectorAll('.perm-user-dropdown').forEach((d) => { d.hidden = true; });
          }
        });
      }
    }

    function openModal(id) {
      if (id === 'modalRoles') closeModal('modalRoleForm');
      document.getElementById(id)?.classList.add('is-open');
      document.body.classList.add('modal-open');
    }
    function closeModal(id) {
      document.getElementById(id)?.classList.remove('is-open');
      if (!document.querySelector('.cfg-modal.is-open')) document.body.classList.remove('modal-open');
    }
    function closeAllModals() {
      document.querySelectorAll('.cfg-modal.is-open').forEach((m) => m.classList.remove('is-open'));
      document.body.classList.remove('modal-open');
    }

    async function boot() {
      const content = document.getElementById('app-content');
      content.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>';
      try {
        const settled = await Promise.allSettled([
          Auth.api('/api/modulos/config/resumen', { noCache: true }),
          UI.loadCecos(),
          UI.loadMateriales(),
          UI.loadProveedores(),
          Auth.api('/api/catalogos/usuarios', { noCache: true }).then((r) => r.data || []),
          Auth.api('/api/modulos/config/roles', { noCache: true }),
          Auth.api('/api/modulos/config/departamentos', { noCache: true }),
          Auth.api('/api/modulos/config/permisos-especiales', { noCache: true }),
          Auth.api('/api/modulos/checklist/catalogo?list=1', { noCache: true }),
          Auth.api('/api/auth/empresas').then((r) => r.empresas || [])
        ]);
        const val = (i, fb) => (settled[i].status === 'fulfilled' ? settled[i].value : fb);
        state.resumen = val(0, { data: {} }).data || {};
        state.cecos = val(1, []);
        state.mats = val(2, []);
        state.provs = val(3, []);
        state.users = val(4, []);
        state.roles = val(5, { data: [] }).data || [];
        state.depts = val(6, { data: [] }).data || [];
        state.permisos = val(7, { data: [] }).data || [];
        const cat = val(8, { total: 0, data: [] });
        state.empresasList = val(9, []);
        state.flotaCatalogo = {
          total: cat.total || 0,
          ultima_carga: cat.ultima_carga || null,
          archivo_nombre: cat.archivo_nombre || null,
          cargado_por_nombre: cat.cargado_por_nombre || null,
          alert_email: cat.alert_email || 'flota@serviciossercom.cl',
          data: cat.data || []
        };
        const failed = settled.map((r, i) => r.status === 'rejected' ? r.reason?.message : null).filter(Boolean);
        render(failed);
      } catch (err) {
        content.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function render(failed = []) {
      const s = state.resumen;
      const content = document.getElementById('app-content');
      content.innerHTML = `
        <div id="flash"></div>
        ${failed.length ? `<div class="alert alert-error">Algunos datos no cargaron: ${failed.join(' · ')}</div>` : ''}

        <div class="stats-grid">
          <div class="stat-card"><div class="stat-label">Usuarios</div><div class="stat-value">${s.usuarios ?? state.users.length}</div></div>
          <div class="stat-card"><div class="stat-label">CECOs</div><div class="stat-value">${s.cecos ?? state.cecos.length}</div></div>
          <div class="stat-card"><div class="stat-label">Materiales</div><div class="stat-value">${s.materiales ?? state.mats.length}</div></div>
          <div class="stat-card"><div class="stat-label">Proveedores</div><div class="stat-value">${s.proveedores ?? state.provs.length}</div></div>
        </div>

        <div class="cfg-section-title">Administrar maestros</div>
        <div class="cfg-tiles">
          <button type="button" class="cfg-tile" data-open="modalUsers">
            <span class="cfg-tile-icon" style="background:#0284c7"><i class="fas fa-users"></i></span>
            <span class="cfg-tile-body">
              <strong>Usuarios y perfiles</strong>
              <small>${state.users.length} registros · cargo, rol y departamento</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalRoles">
            <span class="cfg-tile-icon" style="background:#334155"><i class="fas fa-user-shield"></i></span>
            <span class="cfg-tile-body">
              <strong>Roles</strong>
              <small>${state.roles.length} roles del sistema</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalModulosEmpresa">
            <span class="cfg-tile-icon" style="background:#0369a1"><i class="fas fa-th-large"></i></span>
            <span class="cfg-tile-body">
              <strong>Módulos visibles</strong>
              <small>Qué módulos se muestran en esta empresa</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalModulosCompartidos">
            <span class="cfg-tile-icon" style="background:#0e7490"><i class="fas fa-share-alt"></i></span>
            <span class="cfg-tile-body">
              <strong>Módulos compartidos</strong>
              <small>Misma data SERCOM en todas las empresas</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalPermisos">
            <span class="cfg-tile-icon" style="background:#be185d"><i class="fas fa-key"></i></span>
            <span class="cfg-tile-body">
              <strong>Permisos especiales</strong>
              <small>${state.permisos.length} liberadores · aprobadores y agenda</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalMats">
            <span class="cfg-tile-icon" style="background:#0f766e"><i class="fas fa-boxes"></i></span>
            <span class="cfg-tile-body">
              <strong>Materiales</strong>
              <small>${state.mats.length} ítems · alta rápida</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalCecos">
            <span class="cfg-tile-icon" style="background:#b45309"><i class="fas fa-sitemap"></i></span>
            <span class="cfg-tile-body">
              <strong>CECOs</strong>
              <small>${state.cecos.length} centros de costo</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalProvs">
            <span class="cfg-tile-icon" style="background:#7c3aed"><i class="fas fa-truck"></i></span>
            <span class="cfg-tile-body">
              <strong>Proveedores</strong>
              <small>${state.provs.length} fichas</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalFlotaExcel">
            <span class="cfg-tile-icon" style="background:#059669"><i class="fas fa-file-excel"></i></span>
            <span class="cfg-tile-body">
              <strong>Catálogo flota (Excel)</strong>
              <small>${state.flotaCatalogo.total || 0} vehículos${state.flotaCatalogo.archivo_nombre ? ' · ' + escapeHtml(state.flotaCatalogo.archivo_nombre) : ''}</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalNotifAlertas">
            <span class="cfg-tile-icon" style="background:#dc2626"><i class="fas fa-bell"></i></span>
            <span class="cfg-tile-body">
              <strong>Alertas de notificación</strong>
              <small>Por rol y módulo · siempre / nunca / seleccionar</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
        </div>

        <!-- Modal Usuarios -->
        <div class="cfg-modal" id="modalUsers" role="dialog" aria-modal="true">
          <div class="cfg-modal-backdrop" data-close></div>
          <div class="cfg-modal-panel cfg-modal-lg">
            <header class="cfg-modal-head">
              <div>
                <h2>Usuarios y perfiles</h2>
                <p>Datos de acceso. Los permisos operativos se gestionan en «Permisos especiales».</p>
              </div>
              <button type="button" class="cfg-modal-x" data-close aria-label="Cerrar">&times;</button>

    function resetUserForm(editUser) {
      uId.value = editUser ? editUser.id : '';
      userFormTitle.textContent = editUser ? 'Editar usuario' : 'Nuevo usuario';
      uPassLabel.textContent = editUser ? 'Nueva password (opcional)' : 'Password *';
      uPass.required = !editUser;
      uNombre.value = editUser?.nombre || '';
      uApellido.value = editUser?.apellido || '';
      uEmail.value = editUser?.email || '';
      uPass.value = '';
      uCargo.value = editUser?.cargo || '';
      uTelefono.value = editUser?.telefono || '';
      const selected = Array.isArray(editUser?.rol_ids) && editUser.rol_ids.length
        ? editUser.rol_ids.map(String)
        : (editUser?.rol_id ? [String(editUser.rol_id)] : (state.roles[0] ? [String(state.roles[0].id)] : []));
      document.querySelectorAll('#uRolesBox input[name="uRol"]').forEach((cb) => {
        cb.checked = selected.includes(String(cb.value));
      });
      uDept.value = editUser?.departamento_id ? String(editUser.departamento_id) : '';
      const empSelected = Array.isArray(editUser?.empresas_acceso) && editUser.empresas_acceso.length
        ? editUser.empresas_acceso.map(String)
        : [String(user?.empresa || 'sercom')];
      document.querySelectorAll('#uEmpresasBox input[name="uEmpresa"]').forEach((cb) => {
        cb.checked = empSelected.includes(String(cb.value));
      });
    }

    function readSelectedRolIds() {
      return Array.from(document.querySelectorAll('#uRolesBox input[name="uRol"]:checked'))
        .map((cb) => Number(cb.value))
        .filter((n) => Number.isFinite(n) && n > 0);
    }

    function readSelectedEmpresas() {
      return Array.from(document.querySelectorAll('#uEmpresasBox input[name="uEmpresa"]:checked'))
        .map((cb) => String(cb.value).toLowerCase())
        .filter(Boolean);
    }

    let notifCatalog = [];
    let notifDraft = {};

    function notifChecks(list, name, selected) {
      const sel = new Set((selected || []).map(String));
      return (list || []).map((o) => `
        <label class="notif-check">
          <input type="checkbox" data-filt="${name}" value="${escapeHtml(o.id)}" ${sel.has(String(o.id)) ? 'checked' : ''}>
          <span>${escapeHtml(o.label)}</span>
        </label>
      `).join('');
    }

    function renderNotifModules() {
      const host = document.getElementById('notifModulesHost');
      const rolId = document.getElementById('notifRolSelect')?.value;
      const btn = document.getElementById('btnSaveNotif');
      if (!host) return;
      if (!rolId) {
        host.innerHTML = '<p class="home-empty">Selecciona un rol para ver los módulos.</p>';
        if (btn) btn.disabled = true;
        return;
      }
      if (btn) btn.disabled = false;
      host.innerHTML = notifCatalog.map((mod) => {
        const rule = notifDraft[mod.id] || { modo: 'nunca', filtros: { estados: [], tipos: [], cantidades: [] }, canal: 'ambos' };
        const modo = rule.modo || 'nunca';
        return `
          <section class="notif-mod-card" data-mod="${escapeHtml(mod.id)}">
            <header class="notif-mod-head">
              <strong>${escapeHtml(mod.label)}</strong>
              <div class="notif-modo-group">
                <label><input type="radio" name="modo_${escapeHtml(mod.id)}" value="siempre" ${modo === 'siempre' ? 'checked' : ''}> Siempre</label>
                <label><input type="radio" name="modo_${escapeHtml(mod.id)}" value="nunca" ${modo === 'nunca' ? 'checked' : ''}> Nunca</label>
                <label><input type="radio" name="modo_${escapeHtml(mod.id)}" value="seleccionar" ${modo === 'seleccionar' ? 'checked' : ''}> Seleccionar</label>
              </div>
            </header>
            <div class="notif-select-panel" ${modo === 'seleccionar' ? '' : 'hidden'}>
              <div class="notif-filt-block">
                <h4>Por estado</h4>
                <div class="notif-checks">${notifChecks(mod.estados, 'estados', rule.filtros?.estados)}</div>
              </div>
              <div class="notif-filt-block">
                <h4>Por cantidad</h4>
                <div class="notif-checks">${notifChecks(mod.cantidades, 'cantidades', rule.filtros?.cantidades)}</div>
              </div>
              <div class="notif-filt-block">
                <h4>Por tipo</h4>
                <div class="notif-checks">${notifChecks(mod.tipos, 'tipos', rule.filtros?.tipos)}</div>
              </div>
              <p class="muted" style="font-size:0.78rem;margin:0.35rem 0 0">Puedes marcar varias opciones. Se notificará si coincide al menos un ítem de cada bloque que hayas usado.</p>
            </div>
          </section>`;
      }).join('');

      host.querySelectorAll('.notif-mod-card').forEach((card) => {
        const mid = card.dataset.mod;
        card.querySelectorAll(`input[name="modo_${mid}"]`).forEach((radio) => {
          radio.addEventListener('change', () => {
            if (!notifDraft[mid]) notifDraft[mid] = { modo: 'nunca', filtros: { estados: [], tipos: [], cantidades: [] }, canal: 'ambos' };
            notifDraft[mid].modo = radio.value;
            const panel = card.querySelector('.notif-select-panel');
            if (panel) panel.hidden = radio.value !== 'seleccionar';
          });
        });
        card.querySelectorAll('input[data-filt]').forEach((cb) => {
          cb.addEventListener('change', () => {
            if (!notifDraft[mid]) notifDraft[mid] = { modo: 'seleccionar', filtros: { estados: [], tipos: [], cantidades: [] }, canal: 'ambos' };
            const key = cb.dataset.filt;
            const vals = Array.from(card.querySelectorAll(`input[data-filt="${key}"]:checked`)).map((x) => x.value);
            notifDraft[mid].filtros = notifDraft[mid].filtros || { estados: [], tipos: [], cantidades: [] };
            notifDraft[mid].filtros[key] = vals;
          });
        });
      });
    }

    async function loadModulosEmpresa() {
      const host = document.getElementById('modulosEmpresaHost');
      if (!host) return;
      host.innerHTML = '<p class="muted">Cargando…</p>';
      try {
        const res = await Auth.api('/api/modulos/config/modulos-empresa', { noCache: true });
        const data = res.data || {};
        const visibles = new Set((data.visibles || []).map(String));
        const always = new Set((data.always_on || []).map(String));
        const compartidos = new Set((data.compartidos || []).map(String));
        const catalog = window.PAGES_CATALOG || [];
        host.innerHTML = catalog.map((p) => {
          const locked = always.has(p.key)
            || compartidos.has(p.key)
            || /^(home|configuraciones|perfil|incidencias)\.html$/i.test(p.key);
          const checked = locked || visibles.has(p.key) || !data.configured;
          const tag = always.has(p.key) || /^(home|configuraciones|perfil|incidencias)\.html$/i.test(p.key)
            ? ' <small class="muted">(siempre)</small>'
            : (compartidos.has(p.key) ? ' <small class="muted">(compartido SERCOM)</small>' : '');
          return `<label class="cfg-role-check">
            <input type="checkbox" name="modEmpresa" value="${escapeHtml(p.key)}" ${checked ? 'checked' : ''} ${locked ? 'disabled' : ''}>
            <span>${escapeHtml(p.label)}${tag}</span>
          </label>`;
        }).join('');
        const canEdit = data.can_edit !== false;
        const saveBtn = document.getElementById('btnSaveModulosEmpresa');
        if (saveBtn) saveBtn.disabled = !canEdit;
      } catch (err) {
        host.innerHTML = `<p class="home-empty">${escapeHtml(err.message)}</p>`;
      }
    }

    function readModulosEmpresaChecked() {
      return Array.from(document.querySelectorAll('#modulosEmpresaHost input[name="modEmpresa"]'))
        .filter((cb) => cb.checked || cb.disabled)
        .map((cb) => cb.value);
    }

    async function loadModulosCompartidos() {
      const host = document.getElementById('modulosCompartidosHost');
      if (!host) return;
      host.innerHTML = '<p class="muted">Cargando…</p>';
      try {
        const res = await Auth.api('/api/modulos/config/modulos-compartidos', { noCache: true });
        const data = res.data || {};
        const on = new Set((data.compartidos || []).map(String));
        const supported = new Set((data.data_sercom_supported || ['agenda-camion-pluma.html']).map(String));
        const skip = /^(home|configuraciones|perfil)\.html$/i;
        const catalog = window.PAGES_CATALOG || [];
        host.innerHTML = catalog.filter((p) => !skip.test(p.key)).map((p) => {
          const checked = on.has(p.key);
          const dataOk = supported.has(p.key);
          return `<label class="cfg-role-check">
            <input type="checkbox" name="modCompartido" value="${escapeHtml(p.key)}" ${checked ? 'checked' : ''}>
            <span>${escapeHtml(p.label)}${dataOk ? ' <small class="muted">(data SERCOM)</small>' : ' <small class="muted">(solo visible en todas)</small>'}</span>
          </label>`;
        }).join('') || '<p class="muted">Sin módulos</p>';
        const saveBtn = document.getElementById('btnSaveModulosCompartidos');
        if (saveBtn) saveBtn.disabled = data.can_edit === false;
      } catch (err) {
        host.innerHTML = `<p class="home-empty">${escapeHtml(err.message)}</p>`;
      }
    }

    function readModulosCompartidosChecked() {
      return Array.from(document.querySelectorAll('#modulosCompartidosHost input[name="modCompartido"]:checked'))
        .map((cb) => cb.value);
    }

    async function loadNotifForRol(rolId) {
      const host = document.getElementById('notifModulesHost');
      if (!rolId) {
        notifDraft = {};
        renderNotifModules();
        return;
      }
      if (host) host.innerHTML = '<p class="home-empty">Cargando…</p>';
      try {
        const { data } = await Auth.api('/api/modulos/config/notificaciones/' + rolId);
        notifCatalog = data.catalogo || [];
        notifDraft = {};
        notifCatalog.forEach((m) => {
          const found = (data.reglas || []).find((r) => r.modulo === m.id);
          notifDraft[m.id] = found
            ? { modo: found.modo, filtros: found.filtros || { estados: [], tipos: [], cantidades: [] }, canal: found.canal || 'ambos' }
            : { modo: 'nunca', filtros: { estados: [], tipos: [], cantidades: [] }, canal: 'ambos' };
        });
        renderNotifModules();
      } catch (e) {
        if (host) host.innerHTML = `<p class="home-empty">${escapeHtml(e.message)}</p>`;
      }
    }

    function bindUi() {
      document.querySelectorAll('[data-open]').forEach((btn) => {
        btn.onclick = () => {
          const id = btn.getAttribute('data-open');
          openModal(id);
          if (id === 'modalNotifAlertas') {
            const sel = document.getElementById('notifRolSelect');
            if (sel && !sel.value && state.roles[0]) {
              sel.value = String(state.roles[0].id);
            }
            loadNotifForRol(sel?.value);
          }
          if (id === 'modalModulosEmpresa') loadModulosEmpresa();
          if (id === 'modalModulosCompartidos') loadModulosCompartidos();

        el.onclick = () => closeAllModals();

      document.getElementById('btnModulosAll')?.addEventListener('click', () => {
        document.querySelectorAll('#modulosEmpresaHost input[name="modEmpresa"]').forEach((cb) => { cb.checked = true; });
      });
      document.getElementById('btnModulosNone')?.addEventListener('click', () => {
        document.querySelectorAll('#modulosEmpresaHost input[name="modEmpresa"]').forEach((cb) => {
          if (!cb.disabled) cb.checked = false;
        });
      });
      document.getElementById('btnSaveModulosEmpresa')?.addEventListener('click', async () => {
        try {
          const visibles = readModulosEmpresaChecked();
          const res = await Auth.api('/api/modulos/config/modulos-empresa', {
            method: 'POST',
            body: JSON.stringify({ visibles })
          });
          const u = Auth.getUser() || {};
          u.modulos_empresa = res.data?.visibles || visibles;
          u.modulos_empresa_configured = true;
          u.modulos_compartidos = res.data?.compartidos || u.modulos_compartidos || [];
          Auth.setUser(u);
          UI.flash('Módulos de la empresa actualizados');
          closeAllModals();
        } catch (err) {
          UI.flash(err.message, true);
        }
      });
      document.getElementById('btnSaveModulosCompartidos')?.addEventListener('click', async () => {
        try {
          const compartidos = readModulosCompartidosChecked();
          const res = await Auth.api('/api/modulos/config/modulos-compartidos', {
            method: 'POST',
            body: JSON.stringify({ compartidos })
          });
          const u = Auth.getUser() || {};
          u.modulos_compartidos = res.data?.compartidos || compartidos;
          if (Array.isArray(u.modulos_empresa)) {
            u.modulos_empresa = [...new Set([...(u.modulos_empresa || []), ...(u.modulos_compartidos || [])])];
          }
          Auth.setUser(u);
          UI.flash('Módulos compartidos actualizados (data SERCOM)');
          closeAllModals();
        } catch (err) {
          UI.flash(err.message, true);
        }
      });

      document.getElementById('btnSaveNotif')?.addEventListener('click', async () => {
        const rolId = document.getElementById('notifRolSelect')?.value;
        if (!rolId) return UI.flash('Selecciona un rol', true);
        // sync draft from DOM
        document.querySelectorAll('.notif-mod-card').forEach((card) => {
          const mid = card.dataset.mod;
          const modo = card.querySelector(`input[name="modo_${mid}"]:checked`)?.value || 'nunca';
          const filtros = {
            estados: Array.from(card.querySelectorAll('input[data-filt="estados"]:checked')).map((x) => x.value),
            cantidades: Array.from(card.querySelectorAll('input[data-filt="cantidades"]:checked')).map((x) => x.value),
            tipos: Array.from(card.querySelectorAll('input[data-filt="tipos"]:checked')).map((x) => x.value)
          };
          notifDraft[mid] = { modo, filtros, canal: 'ambos' };
        });
        const reglas = Object.entries(notifDraft).map(([modulo, r]) => ({
          modulo,
          modo: r.modo,
          filtros: r.filtros,
          canal: r.canal || 'ambos'
        }));
        try {
          await Auth.api('/api/modulos/config/notificaciones/' + rolId, {
            method: 'POST',
            body: JSON.stringify({ reglas })
          });
          UI.flash('Alertas de notificación guardadas');
        } catch (err) { UI.flash(err.message, true); }
      });
      document.querySelectorAll('[data-close-userform]').forEach((el) => {
        el.onclick = () => {
          closeModal('modalUserForm');
          openModal('modalUsers');
        };
      });
      document.querySelectorAll('[data-close-roleform]').forEach((el) => {
        el.onclick = () => closeRoleForm();
      });

      document.getElementById('cfgBtnPlantillaFlota')?.addEventListener('click', async () => {
        try {
          const token = Auth.getToken();
          const res = await fetch('/api/modulos/checklist/catalogo/plantilla', {
            headers: { Authorization: 'Bearer ' + token }
          });
          if (!res.ok) throw new Error('No se pudo descargar la plantilla');
          const blob = await res.blob();
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'plantilla_flota_esercom.xlsx';
          a.click();
          URL.revokeObjectURL(a.href);
        } catch (err) { UI.flash(err.message, true); }
      });

      const flotaFile = document.getElementById('cfgExcelFlota');
      document.getElementById('cfgBtnSubirFlota')?.addEventListener('click', () => flotaFile?.click());
      document.getElementById('cfgBtnEliminarFlota')?.addEventListener('click', async () => {
        const name = state.flotaCatalogo.archivo_nombre || 'el catálogo';
        if (!confirm(`¿Eliminar ${name} y todos los vehículos cargados?`)) return;
        try {
          await Auth.api('/api/modulos/checklist/catalogo/eliminar', { method: 'POST', body: '{}' });
          UI.flash('Catálogo de flota eliminado');
          boot().then(() => openModal('modalFlotaExcel'));
        } catch (err) { UI.flash(err.message, true); }
      });
      flotaFile?.addEventListener('change', async () => {
        const file = flotaFile.files?.[0];
        if (!file) return;
        if (!/\.xlsx$/i.test(file.name) && !/\.xls$/i.test(file.name)) {
          UI.flash('Seleccione un archivo Excel (.xlsx)', true);
          flotaFile.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const res = await Auth.api('/api/modulos/checklist/catalogo/import', {
              method: 'POST',
              body: JSON.stringify({ dataUrl: reader.result, filename: file.name })
            });
            UI.flash(`Excel «${file.name}» cargado: ${res.total || 0} vehículos`);
            boot().then(() => openModal('modalFlotaExcel'));
          } catch (err) { UI.flash(err.message, true); }
          finally { flotaFile.value = ''; }
        };
        reader.readAsDataURL(file);
      });

      btnNewRole.onclick = () => openRoleForm(null);

      btnNewUser.onclick = () => {
        resetUserForm(null);
        openModal('modalUserForm');
      };

      async function downloadAuthExcel(url, filename) {
        const token = Auth.getToken();
        const res = await fetch(url, { headers: token ? { Authorization: 'Bearer ' + token } : {} });
        if (!res.ok) {
          let msg = 'No se pudo descargar';
          try { const j = await res.json(); if (j.message) msg = j.message; } catch (_) {}
          throw new Error(msg);
        }
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
          reader.readAsDataURL(file);
        });
      }

            boot().then(() => openModal('modalPermisos'));
          } catch (err) { UI.flash(err.message, true); }
        };
      });

      document.querySelectorAll('[data-edit-role]').forEach((btn) => {
        btn.onclick = () => {
          const r = JSON.parse(decodeURIComponent(btn.getAttribute('data-edit-role')));
          openRoleForm(r);
        };
      });

      document.querySelectorAll('[data-del-role]').forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.getAttribute('data-del-role');
          const name = btn.getAttribute('data-del-name') || 'este rol';
          if (!confirm(`¿Eliminar el rol "${name}"?`)) return;
          try {
            await Auth.api('/api/modulos/config/roles/' + id + '/eliminar', { method: 'POST', body: '{}' });
            UI.flash('Rol eliminado');
            boot().then(() => openModal('modalRoles'));
          } catch (err) { UI.flash(err.message, true); }
        };
      });

      roleForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          const pages = readRolePages();
          const payload = {
            nombre: rNombre.value.trim(),
            descripcion: rDesc.value.trim() || null,
            paginas_permitidas: pages
          };
          if (rId.value) {
            await Auth.api('/api/modulos/config/roles/' + rId.value, { method: 'POST', body: JSON.stringify(payload) });
            UI.flash('Rol actualizado');
          } else {
            await Auth.api('/api/modulos/config/roles', { method: 'POST', body: JSON.stringify(payload) });
            UI.flash('Rol creado');
          }
          closeRoleForm();
          boot().then(() => openModal('modalRoles'));
        } catch (err) { UI.flash(err.message, true); }
      };

      userForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          const id = uId.value;
          const payload = {
            nombre: uNombre.value,
            apellido: uApellido.value,
            email: uEmail.value,
            cargo: uCargo.value || null,
            telefono: uTelefono.value || null,
            rol_ids: readSelectedRolIds(),
            departamento_id: uDept.value ? Number(uDept.value) : null,
            empresas_acceso: readSelectedEmpresas()
          };
          if (!payload.rol_ids.length) throw new Error('Seleccione al menos un rol');
          if (!payload.empresas_acceso.length) throw new Error('Seleccione al menos una empresa');
          payload.rol_id = payload.rol_ids[0];
          if (!id) {
            if (!uPass.value) throw new Error('Password requerida');
            payload.password = uPass.value;
            const created = await Auth.api('/api/modulos/config/usuarios', { method: 'POST', body: JSON.stringify(payload) });
            UI.flash(`Usuario creado · empresas: ${(created.data?.empresas_acceso || payload.empresas_acceso).join(', ')}`);
          } else {
            if (uPass.value.trim()) payload.password = uPass.value.trim();
            await Auth.api('/api/modulos/config/usuarios/' + id, { method: 'POST', body: JSON.stringify(payload) });
            UI.flash(`Usuario actualizado · empresas: ${payload.empresas_acceso.join(', ')}`);
          }
          closeAllModals();
          // Forzar recarga sin caché
          Auth._getCache?.clear?.();
          boot();
        } catch (err) { UI.flash(err.message, true); }
      };

      matForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          await Auth.api('/api/modulos/config/materiales', {
            method: 'POST',
            body: JSON.stringify({
              codigo: mCodigo.value, nombre: mNombre.value, unidad: mUnidad.value || 'UN',
              precio: Number(mPrecio.value) || 0, stock: Number(mStock.value) || 0
            })
          });
          UI.flash('Material creado');
          boot().then(() => openModal('modalMats'));
        } catch (err) { UI.flash(err.message, true); }
      };

      cecoForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          await Auth.api('/api/modulos/config/cecos', {
            method: 'POST',
            body: JSON.stringify({ codigo: cCodigo.value, nombre: cNombre.value })
          });
          UI.flash('CECO creado');
          boot().then(() => openModal('modalCecos'));
        } catch (err) { UI.flash(err.message, true); }
      };

      provForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          await Auth.api('/api/modulos/config/proveedores', {
            method: 'POST',
            body: JSON.stringify({ razon_social: pRazon.value, rut: pRut.value, email: pEmail.value || null })
          });
          UI.flash('Proveedor creado');
          boot().then(() => openModal('modalProvs'));
        } catch (err) { UI.flash(err.message, true); }
      };

      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') closeAllModals();
      }, { once: true });
    }

    if (user) boot();
  </script>
</body>
</html>
