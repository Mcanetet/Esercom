<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Configuraciones - ESERCOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/app.css?v=cfg3" rel="stylesheet">
</head>
<body>
  <script src="/js/auth.js?v=resp2"></script>
  <script src="/js/ui.js?v=resp2"></script>
  <script>
    const user = renderShell('/configuraciones.html', '<i class="fas fa-cog"></i> Configuraciones', 'Maestros y perfiles operativos');

    const FLAG_LABELS = [
      { key: 'flag_checklist', label: 'Checklist Flota', hint: 'Puede registrar checklists' },
      { key: 'flag_flota', label: 'Encargado de Flota', hint: 'Toma requerimientos de flota' },
      { key: 'flag_ssgg', label: 'Servicios Generales', hint: 'Personal de mantención' },
      { key: 'flag_camion_pluma', label: 'Agenda Camión Pluma', hint: 'Puede modificar la agenda' },
      { key: 'flag_aprobador_salida', label: 'Aprobador Salida', hint: 'Aprueba salidas especiales' }
    ];

    let state = { users: [], mats: [], provs: [], cecos: [], roles: [], depts: [], resumen: {}, permisos: [] };

    function flagsHtml(prefix, values = {}) {
      return `<div class="user-flags">${FLAG_LABELS.map((f) => `
        <label class="user-flag">
          <input type="checkbox" id="${prefix}_${f.key}" ${values[f.key] ? 'checked' : ''}>
          <span><strong>${f.label}</strong><small>${f.hint}</small></span>
        </label>`).join('')}</div>`;
    }

    function readFlags(prefix) {
      const out = {};
      FLAG_LABELS.forEach((f) => { out[f.key] = !!document.getElementById(`${prefix}_${f.key}`)?.checked; });
      return out;
    }

    function chips(u) {
      const parts = [];
      if (u.flag_checklist) parts.push('<span class="chip">Checklist</span>');
      if (u.flag_flota) parts.push('<span class="chip chip-flota">Flota</span>');
      if (u.flag_ssgg) parts.push('<span class="chip chip-ssgg">SSGG</span>');
      if (u.flag_camion_pluma) parts.push('<span class="chip chip-camion">Camión</span>');
      if (u.flag_aprobador_salida) parts.push('<span class="chip chip-aprob">Aprob.</span>');
      return parts.join(' ') || '<span class="muted">—</span>';
    }

    function renderPermisosList() {
      const list = state.permisos || [];
      if (!list.length) {
        return '<div class="empty">Sin catálogo de permisos. Reinicia el servidor Node para crear las tablas.</div>';
      }
      const byMod = {};
      list.forEach((p) => {
        const m = p.modulo || 'General';
        if (!byMod[m]) byMod[m] = [];
        byMod[m].push(p);
      });
      const userOpts = state.users.map((u) =>
        `<option value="${u.id}">${u.nombre} ${u.apellido}</option>`
      ).join('');
      return Object.keys(byMod).map((mod) => `
        <div class="perm-mod">
          <h3 class="perm-mod-title">${mod}</h3>
          ${byMod[mod].map((p) => `
            <div class="perm-card" data-codigo="${p.codigo}">
              <div class="perm-card-head">
                <strong>${p.titulo}</strong>
                <code class="perm-code">${p.codigo}</code>
              </div>
              <p class="perm-desc">${p.descripcion || ''}</p>
              <div class="perm-users">
                ${(p.usuarios || []).map((u) => `
                  <span class="perm-chip">
                    ${u.nombre}${u.titular ? ' <em>(titular)</em>' : ''}
                    <button type="button" class="perm-chip-x" title="Quitar"
                      data-quitar-perm="${p.codigo}" data-quitar-uid="${u.usuario_id}">&times;</button>
                  </span>
                `).join('') || '<span class="muted">Sin personas asignadas</span>'}
              </div>
              <div class="perm-add">
                <select data-add-select="${p.codigo}">
                  <option value="">— Agregar persona —</option>
                  ${userOpts}
                </select>
                <button type="button" class="btn btn-primary btn-sm" data-add-perm="${p.codigo}">Asignar</button>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    function openModal(id) {
      document.getElementById(id)?.classList.add('is-open');
      document.body.classList.add('modal-open');
    }
    function closeModal(id) {
      document.getElementById(id)?.classList.remove('is-open');
      if (!document.querySelector('.cfg-modal.is-open')) document.body.classList.remove('modal-open');
    }
    function closeAllModals() {
      document.querySelectorAll('.cfg-modal.is-open').forEach((m) => m.classList.remove('is-open'));
      document.body.classList.remove('modal-open');
    }

    async function boot() {
      const content = document.getElementById('app-content');
      content.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>';
      try {
        const settled = await Promise.allSettled([
          Auth.api('/api/modulos/config/resumen'),
          UI.loadCecos(),
          UI.loadMateriales(),
          UI.loadProveedores(),
          UI.loadUsuarios(),
          Auth.api('/api/modulos/config/roles'),
          Auth.api('/api/modulos/config/departamentos'),
          Auth.api('/api/modulos/config/permisos-especiales')
        ]);
        const val = (i, fb) => (settled[i].status === 'fulfilled' ? settled[i].value : fb);
        state.resumen = val(0, { data: {} }).data || {};
        state.cecos = val(1, []);
        state.mats = val(2, []);
        state.provs = val(3, []);
        state.users = val(4, []);
        state.roles = val(5, { data: [] }).data || [];
        state.depts = val(6, { data: [] }).data || [];
        state.permisos = val(7, { data: [] }).data || [];
        const failed = settled.map((r, i) => r.status === 'rejected' ? r.reason?.message : null).filter(Boolean);
        render(failed);
      } catch (err) {
        content.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function render(failed = []) {
      const s = state.resumen;
      const content = document.getElementById('app-content');
      content.innerHTML = `
        <div id="flash"></div>
        ${failed.length ? `<div class="alert alert-error">Algunos datos no cargaron: ${failed.join(' · ')}</div>` : ''}

        <div class="stats-grid">
          <div class="stat-card"><div class="stat-label">Usuarios</div><div class="stat-value">${s.usuarios ?? state.users.length}</div></div>
          <div class="stat-card"><div class="stat-label">CECOs</div><div class="stat-value">${s.cecos ?? state.cecos.length}</div></div>
          <div class="stat-card"><div class="stat-label">Materiales</div><div class="stat-value">${s.materiales ?? state.mats.length}</div></div>
          <div class="stat-card"><div class="stat-label">Proveedores</div><div class="stat-value">${s.proveedores ?? state.provs.length}</div></div>
        </div>

        <div class="cfg-section-title">Administrar maestros</div>
        <div class="cfg-tiles">
          <button type="button" class="cfg-tile" data-open="modalUsers">
            <span class="cfg-tile-icon" style="background:#0284c7"><i class="fas fa-users"></i></span>
            <span class="cfg-tile-body">
              <strong>Usuarios y perfiles</strong>
              <small>${state.users.length} registros · roles y atributos</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalRoles">
            <span class="cfg-tile-icon" style="background:#334155"><i class="fas fa-user-shield"></i></span>
            <span class="cfg-tile-body">
              <strong>Roles</strong>
              <small>${state.roles.length} roles del sistema</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalPermisos">
            <span class="cfg-tile-icon" style="background:#be185d"><i class="fas fa-key"></i></span>
            <span class="cfg-tile-body">
              <strong>Permisos especiales</strong>
              <small>${state.permisos.length} liberadores · aprobadores y agenda</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalMats">
            <span class="cfg-tile-icon" style="background:#0f766e"><i class="fas fa-boxes"></i></span>
            <span class="cfg-tile-body">
              <strong>Materiales</strong>
              <small>${state.mats.length} ítems · alta rápida</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalCecos">
            <span class="cfg-tile-icon" style="background:#b45309"><i class="fas fa-sitemap"></i></span>
            <span class="cfg-tile-body">
              <strong>CECOs</strong>
              <small>${state.cecos.length} centros de costo</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
          <button type="button" class="cfg-tile" data-open="modalProvs">
            <span class="cfg-tile-icon" style="background:#7c3aed"><i class="fas fa-truck"></i></span>
            <span class="cfg-tile-body">
              <strong>Proveedores</strong>
              <small>${state.provs.length} fichas</small>
            </span>
            <i class="fas fa-chevron-right cfg-tile-arrow"></i>
          </button>
        </div>

        <!-- Modal Usuarios -->
        <div class="cfg-modal" id="modalUsers" role="dialog" aria-modal="true">
          <div class="cfg-modal-backdrop" data-close></div>
          <div class="cfg-modal-panel">
            <header class="cfg-modal-head">
              <div>
                <h2>Usuarios y perfiles</h2>
                <p>Crea usuarios o edita atributos operativos</p>
              </div>
              <button type="button" class="cfg-modal-x" data-close aria-label="Cerrar">&times;</button>
            </header>
            <div class="cfg-modal-body">
              <div class="cfg-modal-actions">
                <button type="button" class="btn btn-primary" id="btnNewUser"><i class="fas fa-user-plus"></i> Nuevo usuario</button>
              </div>
              <div class="table-wrap">
                <table class="data">
                  <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Atributos</th><th></th></tr></thead>
                  <tbody>
                    ${state.users.map((u) => `
                      <tr>
                        <td><strong>${u.nombre} ${u.apellido}</strong><div class="muted">${u.cargo || ''}</div></td>
                        <td>${u.email}</td>
                        <td>${u.rol || '—'}</td>
                        <td>${chips(u)}</td>
                        <td class="cfg-row-actions">
                          <button type="button" class="btn btn-outline btn-sm" data-edit-user='${encodeURIComponent(JSON.stringify(u))}'>Editar</button>
                          <button type="button" class="btn btn-danger btn-sm" data-del-user="${u.id}" data-del-name="${(u.nombre + ' ' + u.apellido).replace(/"/g, '')}" ${u.id === user.id ? 'disabled title="No puedes eliminarte"' : ''}>Eliminar</button>
                        </td>
                      </tr>`).join('') || UI.emptyRow(5, 'Sin usuarios')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal Roles -->
        <div class="cfg-modal" id="modalRoles" role="dialog" aria-modal="true">
          <div class="cfg-modal-backdrop" data-close></div>
          <div class="cfg-modal-panel cfg-modal-sm">
            <header class="cfg-modal-head">
              <div>
                <h2>Roles</h2>
                <p>Define roles y permisos de acceso</p>
              </div>
              <button type="button" class="cfg-modal-x" data-close aria-label="Cerrar">&times;</button>
            </header>
            <div class="cfg-modal-body">
              <form id="roleForm" class="cfg-inline-form" style="flex-direction:column;align-items:stretch">
                <input type="hidden" id="rId">
                <div class="form-group"><label>Nombre *</label><input id="rNombre" required placeholder="Ej: Bodeguero"></div>
                <div class="form-group"><label>Descripción</label><input id="rDesc" placeholder="Opcional"></div>
                <div class="form-group">
                  <label>Páginas permitidas</label>
                  <select id="rPages">
                    <option value="*">Acceso total (*)</option>
                    <option value="limited">Limitado (solo menú básico)</option>
                  </select>
                </div>
                <div class="cfg-modal-footer" style="border:0;padding-top:0;margin-top:0">
                  <button type="button" class="btn btn-secondary" id="btnRoleCancel" hidden>Cancelar edición</button>
                  <button type="submit" class="btn btn-primary" id="btnRoleSave">Crear rol</button>
                </div>
              </form>
              <div class="table-wrap" style="margin-top:1rem;max-height:320px;overflow:auto">
                <table class="data">
                  <thead><tr><th>Rol</th><th>Descripción</th><th></th></tr></thead>
                  <tbody>
                    ${state.roles.map((r) => `
                      <tr>
                        <td><strong>${r.nombre}</strong></td>
                        <td>${r.descripcion || '—'}</td>
                        <td class="cfg-row-actions">
                          <button type="button" class="btn btn-outline btn-sm" data-edit-role='${encodeURIComponent(JSON.stringify(r))}'>Editar</button>
                          <button type="button" class="btn btn-danger btn-sm" data-del-role="${r.id}" data-del-name="${String(r.nombre || '').replace(/"/g, '')}">Eliminar</button>
                        </td>
                      </tr>`).join('') || UI.emptyRow(3, 'Sin roles')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal crear/editar usuario -->
        <div class="cfg-modal" id="modalUserForm" role="dialog" aria-modal="true">
          <div class="cfg-modal-backdrop" data-close-userform></div>
          <div class="cfg-modal-panel cfg-modal-sm">
            <header class="cfg-modal-head">
              <div><h2 id="userFormTitle">Nuevo usuario</h2><p>Datos y visibilidad en módulos</p></div>
              <button type="button" class="cfg-modal-x" data-close-userform>&times;</button>
            </header>
            <div class="cfg-modal-body">
              <form id="userForm">
                <input type="hidden" id="uId">
                <div class="form-row cols-2">
                  <div class="form-group"><label>Nombre *</label><input id="uNombre" required></div>
                  <div class="form-group"><label>Apellido *</label><input id="uApellido" required></div>
                </div>
                <div class="form-row cols-2">
                  <div class="form-group"><label>Email *</label><input type="email" id="uEmail" required></div>
                  <div class="form-group"><label id="uPassLabel">Password *</label><input type="password" id="uPass"></div>
                </div>
                <div class="form-row cols-2">
                  <div class="form-group"><label>Cargo</label><input id="uCargo"></div>
                  <div class="form-group"><label>Teléfono</label><input id="uTelefono"></div>
                </div>
                <div class="form-row cols-2">
                  <div class="form-group"><label>Rol</label><select id="uRol">${UI.optionList(state.roles,'id',x=>x.nombre)}</select></div>
                  <div class="form-group"><label>Departamento</label>
                    <select id="uDept"><option value="">—</option>${UI.optionList(state.depts,'id',x=>x.nombre)}</select>
                  </div>
                </div>
                <h3 class="flags-title">Atributos operativos</h3>
                ${flagsHtml('uf')}
                <div class="cfg-modal-footer">
                  <button type="button" class="btn btn-secondary" data-close-userform>Cancelar</button>
                  <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Modal Permisos especiales -->
        <div class="cfg-modal" id="modalPermisos" role="dialog" aria-modal="true">
          <div class="cfg-modal-backdrop" data-close></div>
          <div class="cfg-modal-panel">
            <header class="cfg-modal-head">
              <div>
                <h2>Permisos especiales</h2>
                <p>Asigna aprobadores y liberadores (antes fijos por nombre: Edith, Nicole, agenda camión, etc.)</p>
              </div>
              <button type="button" class="cfg-modal-x" data-close aria-label="Cerrar">&times;</button>
            </header>
            <div class="cfg-modal-body">
              ${renderPermisosList()}
            </div>
          </div>
        </div>

        <!-- Modal Materiales -->
        <div class="cfg-modal" id="modalMats" role="dialog">
          <div class="cfg-modal-backdrop" data-close></div>
          <div class="cfg-modal-panel">
            <header class="cfg-modal-head">
              <div><h2>Materiales</h2><p>Alta rápida de ítems</p></div>
              <button type="button" class="cfg-modal-x" data-close>&times;</button>
            </header>
            <div class="cfg-modal-body">
              <form id="matForm" class="cfg-inline-form">
                <input id="mCodigo" placeholder="Código *" required>
                <input id="mNombre" placeholder="Nombre *" required>
                <input id="mUnidad" value="UN" style="max-width:70px">
                <input type="number" id="mPrecio" placeholder="Precio" style="max-width:100px">
                <input type="number" id="mStock" placeholder="Stock" style="max-width:90px">
                <button class="btn btn-primary" type="submit">Agregar</button>
              </form>
              <div class="table-wrap" style="margin-top:1rem;max-height:360px;overflow:auto">
                <table class="data">
                  <thead><tr><th>Código</th><th>Nombre</th><th>Unidad</th></tr></thead>
                  <tbody>
                    ${state.mats.slice(0, 80).map((m) => `<tr><td>${m.codigo}</td><td>${m.nombre}</td><td>${m.unidad || 'UN'}</td></tr>`).join('') || UI.emptyRow(3)}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal CECOs -->
        <div class="cfg-modal" id="modalCecos" role="dialog">
          <div class="cfg-modal-backdrop" data-close></div>
          <div class="cfg-modal-panel cfg-modal-sm">
            <header class="cfg-modal-head">
              <div><h2>CECOs</h2><p>Centros de costo</p></div>
              <button type="button" class="cfg-modal-x" data-close>&times;</button>
            </header>
            <div class="cfg-modal-body">
              <form id="cecoForm" class="cfg-inline-form">
                <input id="cCodigo" placeholder="Código *" required>
                <input id="cNombre" placeholder="Nombre *" required>
                <button class="btn btn-primary" type="submit">Agregar</button>
              </form>
              <div class="table-wrap" style="margin-top:1rem;max-height:360px;overflow:auto">
                <table class="data">
                  <thead><tr><th>Código</th><th>Nombre</th></tr></thead>
                  <tbody>
                    ${state.cecos.map((c) => `<tr><td>${c.codigo}</td><td>${c.nombre}</td></tr>`).join('') || UI.emptyRow(2)}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <!-- Modal Proveedores -->
        <div class="cfg-modal" id="modalProvs" role="dialog">
          <div class="cfg-modal-backdrop" data-close></div>
          <div class="cfg-modal-panel cfg-modal-sm">
            <header class="cfg-modal-head">
              <div><h2>Proveedores</h2><p>Fichas de proveedores</p></div>
              <button type="button" class="cfg-modal-x" data-close>&times;</button>
            </header>
            <div class="cfg-modal-body">
              <form id="provForm" class="cfg-inline-form">
                <input id="pRazon" placeholder="Razón social *" required>
                <input id="pRut" placeholder="RUT *" required>
                <input id="pEmail" placeholder="Email">
                <button class="btn btn-primary" type="submit">Agregar</button>
              </form>
              <div class="table-wrap" style="margin-top:1rem;max-height:360px;overflow:auto">
                <table class="data">
                  <thead><tr><th>Nombre</th><th>RUT</th><th>Email</th></tr></thead>
                  <tbody>
                    ${state.provs.map((p) => `<tr><td>${p.razon_social || p.nombre || ''}</td><td>${p.rut || ''}</td><td>${p.email || '—'}</td></tr>`).join('') || UI.emptyRow(3)}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;

      bindUi();
    }

    function resetUserForm(editUser) {
      uId.value = editUser ? editUser.id : '';
      userFormTitle.textContent = editUser ? 'Editar usuario' : 'Nuevo usuario';
      uPassLabel.textContent = editUser ? 'Nueva password (opcional)' : 'Password *';
      uPass.required = !editUser;
      uNombre.value = editUser?.nombre || '';
      uApellido.value = editUser?.apellido || '';
      uEmail.value = editUser?.email || '';
      uPass.value = '';
      uCargo.value = editUser?.cargo || '';
      uTelefono.value = editUser?.telefono || '';
      uRol.value = String(editUser?.rol_id || state.roles[0]?.id || '');
      uDept.value = editUser?.departamento_id ? String(editUser.departamento_id) : '';
      FLAG_LABELS.forEach((f) => {
        const el = document.getElementById('uf_' + f.key);
        if (el) el.checked = !!(editUser && editUser[f.key]);
      });
    }

    function bindUi() {
      document.querySelectorAll('[data-open]').forEach((btn) => {
        btn.onclick = () => openModal(btn.getAttribute('data-open'));
      });
      document.querySelectorAll('[data-close]').forEach((el) => {
        el.onclick = () => closeAllModals();
      });
      document.querySelectorAll('[data-close-userform]').forEach((el) => {
        el.onclick = () => {
          closeModal('modalUserForm');
          openModal('modalUsers');
        };
      });

      btnNewUser.onclick = () => {
        resetUserForm(null);
        openModal('modalUserForm');
      };

      document.querySelectorAll('[data-edit-user]').forEach((btn) => {
        btn.onclick = () => {
          const u = JSON.parse(decodeURIComponent(btn.getAttribute('data-edit-user')));
          resetUserForm(u);
          openModal('modalUserForm');
        };
      });

      document.querySelectorAll('[data-del-user]').forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.getAttribute('data-del-user');
          const name = btn.getAttribute('data-del-name') || 'este usuario';
          if (!confirm(`¿Eliminar a ${name}? Dejará de poder iniciar sesión.`)) return;
          try {
            await Auth.api('/api/modulos/config/usuarios/' + id + '/eliminar', { method: 'POST', body: '{}' });
            UI.flash('Usuario eliminado');
            boot().then(() => openModal('modalUsers'));
          } catch (err) { UI.flash(err.message, true); }
        };
      });

      document.querySelectorAll('[data-add-perm]').forEach((btn) => {
        btn.onclick = async () => {
          const codigo = btn.getAttribute('data-add-perm');
          const sel = document.querySelector(`[data-add-select="${codigo}"]`);
          const usuarioId = Number(sel?.value || 0);
          if (!usuarioId) { UI.flash('Elige una persona', true); return; }
          try {
            await Auth.api('/api/modulos/config/permisos-especiales/' + encodeURIComponent(codigo) + '/usuarios', {
              method: 'POST',
              body: JSON.stringify({ usuario_id: usuarioId })
            });
            UI.flash('Permiso asignado');
            boot().then(() => openModal('modalPermisos'));
          } catch (err) { UI.flash(err.message, true); }
        };
      });

      document.querySelectorAll('[data-quitar-perm]').forEach((btn) => {
        btn.onclick = async () => {
          const codigo = btn.getAttribute('data-quitar-perm');
          const uid = btn.getAttribute('data-quitar-uid');
          if (!confirm('¿Quitar este permiso a la persona?')) return;
          try {
            await Auth.api(
              '/api/modulos/config/permisos-especiales/' + encodeURIComponent(codigo) + '/usuarios/' + uid + '/quitar',
              { method: 'POST', body: '{}' }
            );
            UI.flash('Permiso quitado');
            boot().then(() => openModal('modalPermisos'));
          } catch (err) { UI.flash(err.message, true); }
        };
      });

      function resetRoleForm() {
        rId.value = '';
        rNombre.value = '';
        rDesc.value = '';
        rPages.value = '*';
        btnRoleSave.textContent = 'Crear rol';
        btnRoleCancel.hidden = true;
      }

      btnRoleCancel.onclick = () => resetRoleForm();

      document.querySelectorAll('[data-edit-role]').forEach((btn) => {
        btn.onclick = () => {
          const r = JSON.parse(decodeURIComponent(btn.getAttribute('data-edit-role')));
          rId.value = r.id;
          rNombre.value = r.nombre || '';
          rDesc.value = r.descripcion || '';
          let pages = r.paginas_permitidas;
          try { if (typeof pages === 'string') pages = JSON.parse(pages); } catch (_) {}
          rPages.value = (Array.isArray(pages) && pages.includes('*')) || pages === '*' ? '*' : 'limited';
          btnRoleSave.textContent = 'Guardar cambios';
          btnRoleCancel.hidden = false;
        };
      });

      document.querySelectorAll('[data-del-role]').forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.getAttribute('data-del-role');
          const name = btn.getAttribute('data-del-name') || 'este rol';
          if (!confirm(`¿Eliminar el rol "${name}"?`)) return;
          try {
            await Auth.api('/api/modulos/config/roles/' + id + '/eliminar', { method: 'POST', body: '{}' });
            UI.flash('Rol eliminado');
            boot().then(() => openModal('modalRoles'));
          } catch (err) { UI.flash(err.message, true); }
        };
      });

      roleForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          const pages = rPages.value === '*' ? ['*'] : ['home', 'solicitudes'];
          const payload = {
            nombre: rNombre.value.trim(),
            descripcion: rDesc.value.trim() || null,
            paginas_permitidas: pages
          };
          if (rId.value) {
            await Auth.api('/api/modulos/config/roles/' + rId.value, { method: 'POST', body: JSON.stringify(payload) });
            UI.flash('Rol actualizado');
          } else {
            await Auth.api('/api/modulos/config/roles', { method: 'POST', body: JSON.stringify(payload) });
            UI.flash('Rol creado');
          }
          boot().then(() => openModal('modalRoles'));
        } catch (err) { UI.flash(err.message, true); }
      };

      userForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          const id = uId.value;
          const payload = {
            nombre: uNombre.value,
            apellido: uApellido.value,
            email: uEmail.value,
            cargo: uCargo.value || null,
            telefono: uTelefono.value || null,
            rol_id: Number(uRol.value),
            departamento_id: uDept.value ? Number(uDept.value) : null,
            ...readFlags('uf')
          };
          if (!id) {
            if (!uPass.value) throw new Error('Password requerida');
            payload.password = uPass.value;
            await Auth.api('/api/modulos/config/usuarios', { method: 'POST', body: JSON.stringify(payload) });
            UI.flash('Usuario creado');
          } else {
            if (uPass.value.trim()) payload.password = uPass.value.trim();
            await Auth.api('/api/modulos/config/usuarios/' + id, { method: 'POST', body: JSON.stringify(payload) });
            UI.flash('Usuario actualizado');
          }
          closeAllModals();
          boot();
        } catch (err) { UI.flash(err.message, true); }
      };

      matForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          await Auth.api('/api/modulos/config/materiales', {
            method: 'POST',
            body: JSON.stringify({
              codigo: mCodigo.value, nombre: mNombre.value, unidad: mUnidad.value || 'UN',
              precio: Number(mPrecio.value) || 0, stock: Number(mStock.value) || 0
            })
          });
          UI.flash('Material creado');
          boot().then(() => openModal('modalMats'));
        } catch (err) { UI.flash(err.message, true); }
      };

      cecoForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          await Auth.api('/api/modulos/config/cecos', {
            method: 'POST',
            body: JSON.stringify({ codigo: cCodigo.value, nombre: cNombre.value })
          });
          UI.flash('CECO creado');
          boot().then(() => openModal('modalCecos'));
        } catch (err) { UI.flash(err.message, true); }
      };

      provForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
          await Auth.api('/api/modulos/config/proveedores', {
            method: 'POST',
            body: JSON.stringify({ razon_social: pRazon.value, rut: pRut.value, email: pEmail.value || null })
          });
          UI.flash('Proveedor creado');
          boot().then(() => openModal('modalProvs'));
        } catch (err) { UI.flash(err.message, true); }
      };

      document.addEventListener('keydown', (ev) => {
        if (ev.key === 'Escape') closeAllModals();
      }, { once: true });
    }

    if (user) boot();
  </script>
</body>
</html>
