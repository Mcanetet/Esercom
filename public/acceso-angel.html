<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrenamiento Angel IA - ESERCOM</title>
  <script>
    (function () {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="/css/login.css?v=r2" rel="stylesheet">
  <style>
    .login-card.angel-train-portal { border-top: 3px solid #0ea5e9; }
    .logo.angel-train-logo {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%) !important;
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 0.75rem; color: #fff; font-size: 1.35rem;
    }
    .portal-note {
      font-size: 0.78rem; color: var(--login-muted); text-align: center;
      margin: 0 0 1rem; line-height: 1.45;
    }
    .back-login {
      display: block; text-align: center; margin-top: 1.25rem;
      font-size: 0.82rem; color: var(--login-muted); text-decoration: none;
    }
    .back-login:hover { color: var(--login-accent); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" title="Cambiar tema" aria-label="Tema">
    <i class="fas fa-moon"></i>
  </button>
  <div class="bg-particles"></div>

  <div class="login-container">
    <div class="login-card angel-train-portal">
      <div class="logo-section">
        <div class="logo angel-train-logo"><i class="fas fa-robot"></i></div>
        <h1 class="login-title">Entrenamiento Angel IA</h1>
        <p class="login-subtitle">Acceso reservado · No aparece en el menú</p>
      </div>

      <form id="portalForm" novalidate>
        <div id="alertContainer"></div>
        <p class="portal-note">
          URL privada para configurar y probar Angel IA sin que otros usuarios intervengan.
          Usa la clave <code>ANGEL_TRAIN_PASSWORD</code> del servidor.
        </p>

        <div class="form-group">
          <label class="form-label" for="empresa">Empresa</label>
          <div class="company-chips" role="group" aria-label="Seleccionar empresa">
            <button type="button" class="company-chip active" data-slug="sercom">Sercom</button>
            <button type="button" class="company-chip" data-slug="global">Global</button>
            <button type="button" class="company-chip" data-slug="nexus">Nexus</button>
            <button type="button" class="company-chip" data-slug="tactica">Tactica</button>
            <button type="button" class="company-chip" data-slug="intercanje">Intercanje</button>
          </div>
          <div class="input-container">
            <select class="form-select" id="empresa" name="empresa" required>
              <option value="sercom" selected>Sercom</option>
              <option value="global">Global</option>
              <option value="nexus">Nexus</option>
              <option value="tactica">Tactica</option>
              <option value="intercanje">Intercanje</option>
            </select>
            <i class="fas fa-building input-icon"></i>
            <i class="fas fa-chevron-down select-chevron"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="clave">Clave de entrenamiento</label>
          <div class="input-container">
            <input type="password" class="form-control" id="clave" name="clave"
              autocomplete="off" placeholder="Clave ANGEL_TRAIN_PASSWORD" required>
            <button type="button" class="password-toggle" id="toggleClave" tabindex="-1">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="remember-section">
          <label class="remember-checkbox">
            <input type="checkbox" id="remember" name="remember">
            <span>Mantener sesión (30 días)</span>
          </label>
        </div>

        <button type="submit" class="btn-login" id="portalBtn">
          <span class="btn-text"><i class="fas fa-robot"></i> Entrar a entrenamiento</span>
        </button>
      </form>

      <a class="back-login" href="/login.html"><i class="fas fa-arrow-left"></i> Volver al login de usuarios</a>
    </div>
  </div>

  <script src="/js/acceso-angel.js?v=1"></script>
</body>
</html>
