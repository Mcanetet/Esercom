<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios Generales - ESERCOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const user = renderShell('/serviciosgenerales.html', '<i class="fas fa-tools"></i> Servicios Generales', 'Tickets de mantención y seguimiento');
    const CATS = ['Eléctrico','Gasfitería','Aire acondicionado','Infraestructura','Limpieza','Otro'];
    async function boot() {
      const content = document.getElementById('app-content');
      try {
        const { data } = await Auth.api('/api/modulos/ssgg');
        content.innerHTML = `
          <div id="flash"></div>
          <div class="card"><div class="card-header"><h2>Nuevo ticket</h2></div><div class="card-body">
            <form id="form">
              <div class="form-row cols-3">
                <div class="form-group"><label>Categoría *</label><select id="categoria">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
                <div class="form-group"><label>Prioridad</label><select id="prioridad"><option>Baja</option><option selected>Media</option><option>Alta</option><option>Crítica</option></select></div>
                <div class="form-group"><label>Fecha requerida</label><input type="date" id="fecha_requerida"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Título *</label><input id="titulo" required></div>
                <div class="form-group"><label>Ubicación</label><input id="ubicacion"></div>
              </div>
              <div class="form-group"><label>Descripción</label><textarea id="descripcion"></textarea></div>
              <button class="btn btn-primary" type="submit">Crear ticket</button>
            </form>
          </div></div>
          <div class="card"><div class="card-header"><h2>Tickets</h2></div>
            <div class="card-body table-wrap"><table class="data"><thead><tr><th>Código</th><th>Categoría</th><th>Título</th><th>Prioridad</th><th>Estado</th><th>Solicitante</th><th></th></tr></thead>
            <tbody>${data.map(r=>`<tr>
              <td><strong>${r.codigo}</strong></td><td>${r.categoria}</td><td>${r.titulo}</td>
              <td>${UI.badge(r.prioridad, r.prioridad==='Alta'||r.prioridad==='Crítica'?'#ef4444':'#f59e0b')}</td>
              <td>${UI.badge(r.estado,UI.statusColor(r.estado))}</td><td>${r.solicitante||'—'}</td>
              <td>
                <button class="btn btn-secondary btn-sm" onclick="upd(${r.id},{estado:'En proceso',fecha_inicio:'${new Date().toISOString().slice(0,10)}'})">Iniciar</button>
                <button class="btn btn-success btn-sm" onclick="upd(${r.id},{estado:'Cerrado',fecha_termino_real:'${new Date().toISOString().slice(0,10)}'})">Cerrar</button>
              </td>
            </tr>`).join('')||UI.emptyRow(7)}</tbody></table></div></div>`;
        form.onsubmit = async (e) => {
          e.preventDefault();
          try {
            const r = await Auth.api('/api/modulos/ssgg', { method:'POST', body: JSON.stringify({
              categoria: categoria.value, prioridad: prioridad.value, titulo: titulo.value,
              descripcion: descripcion.value||null, ubicacion: ubicacion.value||null, fecha_requerida: fecha_requerida.value||null
            })});
            UI.flash('Creado '+r.data.codigo); boot();
          } catch(err){ UI.flash(err.message,true); }
        };
      } catch(e){ content.innerHTML=`<div class="alert alert-error">${e.message}</div>`; }
    }
    window.upd = async (id, body) => { await Auth.api('/api/modulos/ssgg/'+id,{method:'POST',body:JSON.stringify(body)}); boot(); };
    if (user) boot();
  </script>
</body>
</html>
