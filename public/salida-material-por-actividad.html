<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Salida Material por Actividad - ESERCOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/app.css?v=toast1" rel="stylesheet">
</head>
<body>
  <script src="/js/auth.js?v=notif2"></script>
  <script src="/js/ui.js?v=resp2"></script>
  <script>
    const user = renderShell('/salida-material-por-actividad.html', '<i class="fas fa-layer-group"></i> Salida Material por Actividad', 'Solicitudes generadas desde recetas / tipos de obra');
    async function boot() {
      const content = document.getElementById('app-content');
      try {
        const [recetas, cecos, list] = await Promise.all([
          Auth.api('/api/modulos/recetas'),
          UI.loadCecos(),
          Auth.api('/api/modulos/salidas-actividad')
        ]);
        const tipos = recetas.data.tipos;
        content.innerHTML = `
          <div id="flash"></div>
          <div class="card">
            <div class="card-header"><h2>Nueva salida por actividad</h2></div>
            <div class="card-body">
              <form id="form">
                <div class="form-row cols-3">
                  <div class="form-group"><label>Tipo de obra / receta *</label>
                    <select id="tipo_receta_id" required><option value="">Seleccione...</option>${UI.optionList(tipos,'id',x=>x.nombre)}</select>
                  </div>
                  <div class="form-group"><label>CECO *</label>
                    <select id="ceco_id" required><option value="">Seleccione...</option>${UI.optionList(cecos,'id',x=>x.codigo+' — '+x.nombre)}</select>
                  </div>
                  <div class="form-group"><label>Cantidad de obras</label><input type="number" id="cantidad_obras" min="1" step="1" value="1"></div>
                </div>
                <div class="form-row">
                  <div class="form-group"><label>Nº proyecto</label><input id="numero_proyecto" placeholder="PRY-..."></div>
                  <div class="form-group"><label>Observaciones</label><input id="observaciones"></div>
                </div>
                <button class="btn btn-primary" type="submit"><i class="fas fa-calculator"></i> Calcular y crear</button>
              </form>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h2>Salidas</h2></div>
            <div class="card-body table-wrap" id="list">${renderList(list.data)}</div>
          </div>`;
        document.getElementById('form').onsubmit = async (e) => {
          e.preventDefault();
          try {
            const r = await Auth.api('/api/modulos/salidas-actividad', {
              method: 'POST',
              body: JSON.stringify({
                tipo_receta_id: Number(document.getElementById('tipo_receta_id').value),
                ceco_id: Number(document.getElementById('ceco_id').value),
                cantidad_obras: Number(document.getElementById('cantidad_obras').value) || 1,
                numero_proyecto: document.getElementById('numero_proyecto').value.trim() || null,
                observaciones: document.getElementById('observaciones').value.trim() || null
              })
            });
            UI.flash(`Creada ${r.data.codigo}`);
            const again = await Auth.api('/api/modulos/salidas-actividad');
            document.getElementById('list').innerHTML = renderList(again.data);
            e.target.reset();
          } catch (err) { UI.flash(err.message, true); }
        };
      } catch (err) { content.innerHTML = `<div class="alert alert-error">${err.message}</div>`; }
    }
    function renderList(rows) {
      if (!rows.length) return '<div class="empty">Sin salidas</div>';
      return `<table class="data"><thead><tr><th>Código</th><th>Tipo</th><th>Proyecto</th><th>Obras</th><th>CECO</th><th>Estado</th><th>Fecha</th><th></th></tr></thead><tbody>
        ${rows.map(r=>`<tr>
          <td><strong>${r.codigo}</strong></td><td>${r.tipo_nombre||'—'}</td><td>${r.numero_proyecto||'—'}</td>
          <td>${r.cantidad_obras}</td><td>${r.ceco_codigo||'—'}</td>
          <td>${UI.badge(r.estado, UI.statusColor(r.estado))}</td><td>${formatDate(r.fecha_creacion)}</td>
          <td><button class="btn btn-outline btn-sm" onclick="ver(${r.id})">Ver</button></td>
        </tr>`).join('')}</tbody></table>`;
    }
    async function ver(id) {
      const { data } = await Auth.api('/api/modulos/salidas-actividad/' + id);
      alert(`${data.codigo}\n${(data.detalle||[]).map(d=>`- ${d.descripcion}: ${d.cantidad} ${d.unidad}`).join('\n')}`);
    }
    window.ver = ver;
    if (user) boot();
  </script>
</body>
</html>
