<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Creación Datos Maestros - ESERCOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/app.css?v=resp2" rel="stylesheet">
</head>
<body>
  <script src="/js/auth.js?v=resp2"></script>
  <script src="/js/ui.js?v=resp2"></script>
  <script>
    const user = renderShell('/creacion-datos-maestros.html', '<i class="fas fa-database"></i> Creación Datos Maestros', 'Alta de materiales y servicios nuevos');
    async function boot() {
      const content = document.getElementById('app-content');
      try {
        const { data } = await Auth.api('/api/modulos/datos-maestros');
        content.innerHTML = `
          <div id="flash"></div>
          <div class="card"><div class="card-header"><h2>Nueva solicitud de dato maestro</h2></div><div class="card-body">
            <form id="form">
              <div class="form-row cols-3">
                <div class="form-group"><label>Tipo</label><select id="tipo"><option>Material</option><option>Servicio</option></select></div>
                <div class="form-group"><label>Descripción *</label><input id="descripcion" required></div>
                <div class="form-group"><label>Unidad</label><input id="unidad_medida" value="UN"></div>
              </div>
              <div class="form-row cols-3">
                <div class="form-group"><label>Color</label><input id="color"></div>
                <div class="form-group"><label>Medida</label><input id="medida"></div>
                <div class="form-group"><label>Observaciones</label><input id="observaciones"></div>
              </div>
              <button class="btn btn-primary" type="submit">Crear</button>
            </form>
          </div></div>
          <div class="card"><div class="card-header"><h2>Solicitudes</h2></div>
            <div class="card-body table-wrap"><table class="data"><thead><tr><th>ID</th><th>Tipo</th><th>Descripción</th><th>Unidad</th><th>Código</th><th>Estado</th><th>Solicitante</th><th></th></tr></thead>
            <tbody>${data.map(r=>`<tr>
              <td>${r.id}</td><td>${r.tipo}</td><td>${r.descripcion}</td><td>${r.unidad_medida}</td><td>${r.codigo||'—'}</td>
              <td>${UI.badge(r.estado,UI.statusColor(r.estado))}</td><td>${r.solicitante||'—'}</td>
              <td><button class="btn btn-secondary btn-sm" onclick="asignar(${r.id})">Código</button>
              <button class="btn btn-success btn-sm" onclick="aprobar(${r.id})">Aprobar</button>
              <button class="btn btn-outline btn-sm" onclick="eliminar(${r.id})">Papelera</button></td>
            </tr>`).join('')||UI.emptyRow(8)}</tbody></table></div></div>`;
        form.onsubmit = async (e) => {
          e.preventDefault();
          try {
            await Auth.api('/api/modulos/datos-maestros', { method:'POST', body: JSON.stringify({
              tipo: tipo.value, descripcion: descripcion.value, unidad_medida: unidad_medida.value,
              color: color.value||null, medida: medida.value||null, observaciones: observaciones.value||null
            })});
            UI.flash('Creado'); boot();
          } catch(err){ UI.flash(err.message,true); }
        };
      } catch(e){ content.innerHTML=`<div class="alert alert-error">${e.message}</div>`; }
    }
    window.asignar = async (id) => {
      const codigo = prompt('Código maestro:');
      if (!codigo) return;
      await Auth.api('/api/modulos/datos-maestros/'+id, { method:'POST', body: JSON.stringify({ codigo, estado: 'En gestión' }) });
      boot();
    };
    window.aprobar = async (id) => {
      await Auth.api('/api/modulos/datos-maestros/'+id, { method:'POST', body: JSON.stringify({ estado: 'Aprobado' }) });
      UI.flash('Aprobado'); boot();
    };
    window.eliminar = async (id) => {
      if (!confirm('¿Mover a papelera?')) return;
      await Auth.api('/api/modulos/datos-maestros/'+id+'/eliminar', { method:'POST', body:'{}' });
      boot();
    };
    if (user) boot();
  </script>
</body>
</html>
