<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Angel IA - ESERCOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="/css/app.css?v=mob2" rel="stylesheet">
</head>
<body>
  <script src="/js/auth.js?v=notif2"></script>
  <script src="/js/ui.js?v=resp2"></script>
  <script src="/js/angel-chat-ui.js?v=voz3"></script>
  <script>
    const user = renderShell('/angel-ia.html', '<span class="angel-mark angel-mark--inline"><span class="angel-mark-letter">A</span></span> Angel', 'Agente ESERCOM · reportes, alertas y consultas');

    async function boot() {
      const content = document.getElementById('app-content');
      try {
        const [status, alertas, reportes, historial] = await Promise.all([
          Auth.api('/api/angel/status'),
          Auth.api('/api/angel/alertas'),
          Auth.api('/api/angel/reportes'),
          Auth.api('/api/angel/chat/historial')
        ]);

        content.innerHTML = `
          <div id="flash"></div>
          <div class="angel-layout">
            <section class="angel-main card">
              <div class="card-header">
                <h2><span class="angel-mark angel-mark--inline"><span class="angel-mark-letter">A</span></span> Conversar con Angel</h2>
                <span class="badge" style="background:${status.data.activo ? '#22c55e' : '#ef4444'}">
                  ${status.data.activo ? 'Activo · ' + status.data.model : 'Sin API key'}
                </span>
              </div>
              <div class="card-body angel-chat-wrap">
                ${!status.data.activo ? `
                  <div class="alert alert-error">
                    Angel IA no está disponible. El administrador debe configurar <code>OPENAI_API_KEY</code> en el servidor.
                  </div>` : ''}
                <div class="angel-chat" id="chatBox"></div>
                <form id="chatForm" class="angel-compose">
                  <input type="file" id="chatPhoto" accept="image/jpeg,image/png,image/webp,image/*" hidden>
                  <button type="button" class="btn btn-outline angel-attach-btn" id="chatAttach" title="Adjuntar foto (crea incidencia)" ${status.data.activo ? '' : 'disabled'}>
                    <i class="fas fa-camera"></i>
                  </button>
                  <button type="button" class="btn btn-outline angel-mic-btn" id="chatMic" title="Mensaje de voz" ${status.data.activo && status.data.voz?.voz_activa !== false ? '' : 'disabled'}>
                    <i class="fas fa-microphone"></i>
                  </button>
                  <input id="chatInput" placeholder="Escribe, habla o adjunta foto…" autocomplete="off" ${status.data.activo ? '' : 'disabled'}>
                  <button class="btn btn-primary" type="submit" ${status.data.activo ? '' : 'disabled'}>
                    <i class="fas fa-paper-plane"></i>
                  </button>
                </form>
                <div class="angel-attach-preview" id="chatPreview" hidden></div>
                <div class="angel-suggestions">
                  <button type="button" data-q="¿Qué pendientes y alertas hay ahora?">Pendientes</button>
                  <button type="button" data-q="Genera el Excel semanal de movimientos por centro de costo y materiales">Excel semanal</button>
                  <button type="button" data-q="Resume el estado de materiales y stock bajo">Stock</button>
                  <button type="button" data-q="Quiero reportar un problema del sistema">Incidencia</button>
                </div>
              </div>
            </section>

            <aside class="angel-side">
              <div class="card">
                <div class="card-header">
                  <h2>Alertas</h2>
                  <button class="btn btn-secondary btn-sm" id="btnSync"><i class="fas fa-sync"></i></button>
                </div>
                <div class="card-body" id="alertBox">${renderAlerts(alertas.data)}</div>
              </div>
              <div class="card">
                <div class="card-header">
                  <h2>Reportes Excel</h2>
                  <button class="btn btn-primary btn-sm" id="btnExcel"><i class="fas fa-file-excel"></i> Generar</button>
                </div>
                <div class="card-body" id="reportBox">${renderReports(reportes.data)}</div>
              </div>
            </aside>
          </div>
        `;

        const chatBox = document.getElementById('chatBox');
        historial.data.forEach((m) => AngelChatUI.appendMsg(chatBox, m.rol, m.contenido, m.downloads));
        if (!historial.data.length) {
          AngelChatUI.appendMsg(chatBox, 'assistant', 'Hola, soy Angel IA. Puedo revisar pendientes, generar Excel y crear incidencias si adjuntes una foto del problema. ¿En qué te ayudo?');
        }

        let pendingPhoto = null;
        let lastViaVoz = false;
        let voiceAutoplay = status.data.voz?.voz_autoplay !== false && status.data.voz?.voz_activa !== false;

        document.getElementById('chatAttach')?.addEventListener('click', () => chatPhoto.click());
        document.getElementById('chatPhoto')?.addEventListener('change', () => {
          const f = chatPhoto.files?.[0];
          const box = document.getElementById('chatPreview');
          if (!f) { pendingPhoto = null; box.hidden = true; box.innerHTML = ''; return; }
          const reader = new FileReader();
          reader.onload = () => {
            pendingPhoto = reader.result;
            box.hidden = false;
            box.innerHTML = `<img src="${pendingPhoto}" alt=""><button type="button" id="chatClearPhoto">&times;</button>`;
            document.getElementById('chatClearPhoto').onclick = () => {
              pendingPhoto = null; chatPhoto.value = ''; box.hidden = true; box.innerHTML = '';
            };
          };
          reader.readAsDataURL(f);
        });

        async function sendChat(msg, photo, viaVoz) {
          if (!msg && !photo) return;
          chatInput.value = '';
          AngelChatUI.appendMsg(chatBox, 'user', photo ? `${msg || 'Problema con foto'} 📷` : (viaVoz ? `🎤 ${msg}` : msg));
          const thinking = AngelChatUI.appendMsg(chatBox, 'assistant', 'Pensando…');
          pendingPhoto = null;
          const box = document.getElementById('chatPreview');
          if (box) { box.hidden = true; box.innerHTML = ''; }
          if (chatPhoto) chatPhoto.value = '';
          try {
            const r = await Auth.api('/api/angel/chat', {
              method: 'POST',
              body: JSON.stringify({
                message: msg || 'Problema reportado con foto',
                imageDataUrl: photo || null,
                via_voz: !!viaVoz
              })
            });
            AngelChatUI.setBubble(thinking, r.data.reply, r.data.downloads);
            if (viaVoz && voiceAutoplay && r.data.reply) {
              try { await AngelChatUI.speakText(r.data.reply); } catch (_) { /* mute ok */ }
            }
            if (r.data.tools?.some((t) => /generar_excel|generar_informe|generar_alertas/.test(t.name))) {
              refreshSide();
            }
          } catch (err) {
            AngelChatUI.setBubble(thinking, err.message);
          }
        }

        if (status.data.activo && status.data.voz?.voz_activa !== false) {
          AngelChatUI.bindMicButton({
            button: document.getElementById('chatMic'),
            input: chatInput,
            async onText(text) {
              await sendChat(text, null, true);
            }
          });
        }

        document.getElementById('chatForm').onsubmit = async (e) => {
          e.preventDefault();
          const msg = chatInput.value.trim();
          const photo = pendingPhoto;
          if (!msg && !photo) return;
          await sendChat(msg, photo, false);
        };

        document.querySelectorAll('[data-q]').forEach((btn) => {
          btn.onclick = () => {
            chatInput.value = btn.dataset.q;
            chatForm.requestSubmit();
          };
        });

        document.getElementById('btnSync').onclick = async () => {
          try {
            const r = await Auth.api('/api/angel/alertas/sincronizar', { method: 'POST', body: '{}' });
            UI.flash(r.message || 'Sincronizado');
            refreshSide();
          } catch (e) { UI.flash(e.message, true); }
        };

        document.getElementById('btnExcel').onclick = async () => {
          try {
            const r = await Auth.api('/api/angel/reportes/semanal', { method: 'POST', body: '{}' });
            UI.flash('Excel generado');
            await downloadAuth(r.data.download, 'reporte_angel.xlsx');
            refreshSide();
          } catch (e) { UI.flash(e.message, true); }
        };
      } catch (e) {
        content.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      }
    }

    function renderAlerts(rows) {
      if (!rows.length) return '<p class="home-empty">Sin alertas pendientes</p>';
      return `<ul class="angel-alert-list">${rows.slice(0, 12).map((a) => `
        <li class="sev-${a.severidad}">
          <strong>${a.titulo}</strong>
          <span>${a.mensaje}</span>
          <button type="button" onclick="leerAlerta(${a.id})">Marcar leída</button>
        </li>`).join('')}</ul>
        <button class="btn btn-secondary btn-sm" style="margin-top:.5rem;width:100%" onclick="leerTodas()">Marcar todas</button>`;
    }

    function renderReports(rows) {
      if (!rows.length) return '<p class="home-empty">Aún no hay reportes</p>';
      return `<ul class="angel-report-list">${rows.slice(0, 8).map((r) => `
        <li>
          <strong>${r.titulo}</strong>
          <small>${formatDate(r.fecha_creacion)}</small>
          ${r.archivo ? `<button type="button" class="btn btn-outline btn-sm" onclick="dl('${r.archivo}')">Descargar</button>` : ''}
        </li>`).join('')}</ul>`;
    }

    function appendMsg(box, rol, text) {
      return AngelChatUI.appendMsg(box, rol, text);
    }

    async function refreshSide() {
      const [alertas, reportes] = await Promise.all([
        Auth.api('/api/angel/alertas'),
        Auth.api('/api/angel/reportes')
      ]);
      document.getElementById('alertBox').innerHTML = renderAlerts(alertas.data);
      document.getElementById('reportBox').innerHTML = renderReports(reportes.data);
    }

    async function downloadAuth(url, name) {
      return AngelChatUI.downloadAuth(url, name);
    }

    window.leerAlerta = async (id) => {
      await Auth.api('/api/angel/alertas/' + id + '/leer', { method: 'POST', body: '{}' });
      refreshSide();
    };
    window.leerTodas = async () => {
      await Auth.api('/api/angel/alertas/leer-todas', { method: 'POST', body: '{}' });
      refreshSide();
    };
    window.dl = async (archivo) => {
      const file = String(archivo).split('/').pop();
      await downloadAuth('/api/angel/reportes/download/' + file, file);
    };

    if (user) boot();
  </script>
</body>
</html>
